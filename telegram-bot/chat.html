<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code Chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #0a0a0a;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: #111;
    border-bottom: 1px solid #222;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 32px;
    height: 32px;
    background: #22C55E;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: bold;
    color: #000;
  }

  .logo h1 {
    font-size: 16px;
    font-weight: 600;
    color: #fff;
  }

  .logo span {
    font-size: 12px;
    color: #666;
    margin-right: 8px;
  }

  .header-actions {
    display: flex;
    gap: 8px;
  }

  .btn {
    background: #1a1a1a;
    border: 1px solid #333;
    color: #aaa;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
  }

  .btn:hover { background: #222; color: #fff; border-color: #444; }
  .btn.danger:hover { border-color: #ef4444; color: #ef4444; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .message {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.6;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .message.user {
    align-self: flex-end;
    background: #22C55E;
    color: #000;
    border-bottom-left: 4px;
  }

  .message.assistant {
    align-self: flex-start;
    background: #1a1a1a;
    border: 1px solid #222;
  }

  .message.assistant code {
    background: #0d0d0d;
    padding: 1px 5px;
    border-radius: 3px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 13px;
  }

  .message.assistant pre {
    background: #0d0d0d;
    padding: 10px 14px;
    border-radius: 6px;
    overflow-x: auto;
    margin: 8px 0;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 13px;
    direction: ltr;
    text-align: left;
  }

  .message.error {
    align-self: center;
    background: #1a0000;
    border: 1px solid #4a0000;
    color: #ef4444;
    font-size: 13px;
  }

  .message .cost {
    font-size: 11px;
    color: #555;
    margin-top: 6px;
  }

  .typing {
    align-self: flex-start;
    padding: 12px 20px;
    background: #1a1a1a;
    border: 1px solid #222;
    border-radius: 12px;
    display: none;
  }

  .typing.active { display: flex; gap: 4px; align-items: center; }

  .typing-dot {
    width: 8px;
    height: 8px;
    background: #22C55E;
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }

  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  .input-area {
    background: #111;
    border-top: 1px solid #222;
    padding: 16px 20px;
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }

  #input {
    flex: 1;
    background: #1a1a1a;
    border: 1px solid #333;
    color: #e0e0e0;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    outline: none;
    min-height: 44px;
    max-height: 120px;
    direction: rtl;
  }

  #input:focus { border-color: #22C55E; }
  #input::placeholder { color: #555; }

  #send {
    background: #22C55E;
    border: none;
    color: #000;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }

  #send:hover { background: #16a34a; }
  #send:disabled { background: #333; color: #666; cursor: not-allowed; }

  .welcome {
    text-align: center;
    padding: 60px 20px;
    color: #444;
  }

  .welcome h2 { color: #666; font-size: 20px; margin-bottom: 8px; }
  .welcome p { font-size: 14px; }

  @media (max-width: 600px) {
    .message { max-width: 92%; }
    .logo span { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">C</div>
    <div>
      <h1>Claude Code Chat</h1>
      <span id="status-info">architect-workshops</span>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn danger" onclick="resetSession()">שיחה חדשה</button>
  </div>
</header>

<div id="messages">
  <div class="welcome">
    <h2>Claude Code</h2>
    <p>מחובר לפרויקט architect-workshops עם גישה מלאה לכל הסקילים</p>
  </div>
</div>

<div class="typing" id="typing">
  <div class="typing-dot"></div>
  <div class="typing-dot"></div>
  <div class="typing-dot"></div>
</div>

<div class="input-area">
  <textarea id="input" placeholder="שלח הודעה לקלוד..." rows="1"></textarea>
  <button id="send" onclick="sendMessage()">&#9654;</button>
</div>

<script>
  let sessionKey = localStorage.getItem('claude_session') || '';
  let isProcessing = false;

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const typingEl = document.getElementById('typing');

  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  // Enter to send (Shift+Enter for newline)
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function addMessage(text, role, cost) {
    // Remove welcome message
    const welcome = messagesEl.querySelector('.welcome');
    if (welcome) welcome.remove();

    const div = document.createElement('div');
    div.className = `message ${role}`;

    if (role === 'assistant') {
      // Basic markdown: code blocks, inline code, bold
      let html = escapeHtml(text);
      // Code blocks
      html = html.replace(/```(\w*)\n?([\s\S]*?)```/g,
        '<pre><code>$2</code></pre>');
      // Inline code
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      // Bold
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      div.innerHTML = html;
      if (cost && cost > 0) {
        const costEl = document.createElement('div');
        costEl.className = 'cost';
        costEl.textContent = `$${cost.toFixed(4)}`;
        div.appendChild(costEl);
      }
    } else if (role === 'error') {
      div.textContent = text;
    } else {
      div.textContent = text;
    }

    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function escapeHtml(text) {
    const d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isProcessing) return;

    isProcessing = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';

    addMessage(text, 'user');
    typingEl.classList.add('active');
    messagesEl.scrollTop = messagesEl.scrollHeight;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_key: sessionKey }),
      });

      const data = await res.json();

      if (data.session_key) {
        sessionKey = data.session_key;
        localStorage.setItem('claude_session', sessionKey);
      }

      if (data.error) {
        addMessage(data.text, 'error');
      } else {
        addMessage(data.text, 'assistant', data.cost);
      }
    } catch (err) {
      addMessage(`Connection error: ${err.message}`, 'error');
    } finally {
      typingEl.classList.remove('active');
      isProcessing = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  async function resetSession() {
    if (sessionKey) {
      await fetch('/api/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_key: sessionKey }),
      }).catch(() => {});
    }
    sessionKey = '';
    localStorage.removeItem('claude_session');
    messagesEl.innerHTML = `
      <div class="welcome">
        <h2>Claude Code</h2>
        <p>מחובר לפרויקט architect-workshops עם גישה מלאה לכל הסקילים</p>
      </div>`;
  }

  // Load status
  fetch('/api/status').then(r => r.json()).then(d => {
    document.getElementById('status-info').textContent =
      `${d.model} | ${d.project.split('/').pop()}`;
  }).catch(() => {});

  inputEl.focus();
</script>
</body>
</html>
