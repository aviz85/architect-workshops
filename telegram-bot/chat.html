<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code Chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #f5f5f5;
    color: #1a1a1a;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: #fff;
    border-bottom: 1px solid #e0e0e0;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    z-index: 10;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 32px;
    height: 32px;
    background: #22C55E;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: bold;
    color: #fff;
  }

  .logo h1 { font-size: 16px; font-weight: 600; color: #1a1a1a; }
  .logo span { font-size: 12px; color: #888; margin-right: 8px; }

  .header-actions { display: flex; gap: 8px; }

  .btn {
    background: #fff;
    border: 1px solid #d0d0d0;
    color: #555;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
  }

  .btn:hover { background: #f0f0f0; color: #333; border-color: #bbb; }
  .btn.danger:hover { border-color: #ef4444; color: #ef4444; }
  .btn.active { background: #22C55E; color: #fff; border-color: #22C55E; }

  /* --- Layout --- */
  .main-area {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* --- Workshops Panel --- */
  .workshops-panel {
    width: 340px;
    background: #fff;
    border-left: 1px solid #e0e0e0;
    display: none;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
  }

  .workshops-panel.open { display: flex; }

  .panel-header {
    padding: 14px 16px;
    border-bottom: 1px solid #e8e8e8;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .panel-header h2 { font-size: 15px; font-weight: 600; }

  .panel-close {
    background: none;
    border: none;
    font-size: 18px;
    cursor: pointer;
    color: #999;
    padding: 4px 8px;
    border-radius: 4px;
  }

  .panel-close:hover { background: #f0f0f0; color: #333; }

  .workshops-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .workshop-card {
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #eee;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }

  .workshop-card:hover { background: #f8f8f8; border-color: #ddd; }

  .workshop-card .date {
    font-size: 12px;
    color: #22C55E;
    font-weight: 600;
    margin-bottom: 4px;
    direction: ltr;
    text-align: right;
  }

  .workshop-card .title {
    font-size: 14px;
    font-weight: 500;
    color: #1a1a1a;
    line-height: 1.4;
    margin-bottom: 6px;
  }

  .workshop-card .desc {
    font-size: 12px;
    color: #777;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .workshop-card .badges {
    display: flex;
    gap: 4px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .badge {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 10px;
    background: #f0f0f0;
    color: #666;
  }

  .badge.green { background: #dcfce7; color: #16a34a; }
  .badge.blue { background: #dbeafe; color: #2563eb; }
  .badge.purple { background: #f3e8ff; color: #7c3aed; }

  .workshop-card.future { border-right: 3px solid #22C55E; }
  .workshop-card.past { opacity: 0.75; }

  /* --- New Workshop Button --- */
  .new-workshop-btn {
    margin: 8px;
    padding: 10px;
    background: #22C55E;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    flex-shrink: 0;
  }

  .new-workshop-btn:hover { background: #16a34a; }

  /* --- Modal --- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: #fff;
    border-radius: 14px;
    padding: 28px;
    width: 480px;
    max-width: 92vw;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
  }

  .modal h2 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 20px;
    color: #1a1a1a;
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: #555;
    margin-bottom: 5px;
  }

  .form-group input,
  .form-group textarea,
  .form-group select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d0d0d0;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    color: #1a1a1a;
    background: #fafafa;
    outline: none;
    direction: rtl;
  }

  .form-group input:focus,
  .form-group textarea:focus,
  .form-group select:focus {
    border-color: #22C55E;
    background: #fff;
  }

  .form-group textarea { resize: vertical; min-height: 70px; }

  .form-row {
    display: flex;
    gap: 12px;
  }

  .form-row .form-group { flex: 1; }

  .form-group input[type="date"],
  .form-group input[type="time"] {
    direction: ltr;
    text-align: right;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-start;
    margin-top: 24px;
  }

  .modal-actions .btn-primary {
    background: #22C55E;
    color: #fff;
    border: none;
    padding: 10px 24px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }

  .modal-actions .btn-primary:hover { background: #16a34a; }

  .modal-actions .btn-cancel {
    background: #fff;
    color: #666;
    border: 1px solid #d0d0d0;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }

  .modal-actions .btn-cancel:hover { background: #f5f5f5; }

  /* --- Chat Area --- */
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    padding-bottom: 10px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
  }

  .message {
    max-width: 85%;
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.6;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .message.user {
    align-self: flex-end;
    background: #22C55E;
    color: #fff;
    border-bottom-left-radius: 4px;
  }

  .message.assistant {
    align-self: flex-start;
    background: #fff;
    border: 1px solid #e0e0e0;
    color: #1a1a1a;
  }

  .message.assistant code {
    background: #f0f0f0;
    padding: 1px 5px;
    border-radius: 3px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 13px;
    color: #333;
  }

  .message.assistant pre {
    background: #f7f7f7;
    padding: 10px 14px;
    border-radius: 6px;
    overflow-x: auto;
    margin: 8px 0;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 13px;
    direction: ltr;
    text-align: left;
    border: 1px solid #e8e8e8;
  }

  .message.error {
    align-self: center;
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #dc2626;
    font-size: 13px;
  }

  .message .cost {
    font-size: 11px;
    color: #aaa;
    margin-top: 6px;
  }

  .typing {
    align-self: flex-start;
    padding: 12px 20px;
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    display: none;
    max-width: 800px;
    margin: 0 auto;
  }

  .typing.active { display: flex; gap: 4px; align-items: center; }

  .typing-dot {
    width: 8px;
    height: 8px;
    background: #22C55E;
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }

  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  .input-wrap {
    background: #fff;
    border-top: 1px solid #e0e0e0;
    flex-shrink: 0;
  }

  .input-area {
    padding: 16px 20px;
    display: flex;
    gap: 10px;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
  }

  #input {
    flex: 1;
    background: #f5f5f5;
    border: 1px solid #d0d0d0;
    color: #1a1a1a;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    outline: none;
    min-height: 44px;
    max-height: 120px;
    direction: rtl;
  }

  #input:focus { border-color: #22C55E; background: #fff; }
  #input::placeholder { color: #999; }

  #send {
    background: #22C55E;
    border: none;
    color: #fff;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }

  #send:hover { background: #16a34a; }
  #send:disabled { background: #d0d0d0; color: #999; cursor: not-allowed; }

  .welcome {
    text-align: center;
    padding: 60px 20px;
    color: #999;
  }

  .welcome h2 { color: #555; font-size: 20px; margin-bottom: 8px; }
  .welcome p { font-size: 14px; }

  @media (max-width: 768px) {
    .workshops-panel { position: fixed; top: 0; right: 0; bottom: 0; width: 85%; z-index: 100; box-shadow: -4px 0 20px rgba(0,0,0,0.1); }
    .message { max-width: 92%; }
    .logo span { display: none; }
    #messages, .input-area { max-width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">C</div>
    <div>
      <h1>Claude Code Chat</h1>
      <span id="status-info">architect-workshops</span>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn" id="workshops-btn" onclick="toggleWorkshops()">סדנאות</button>
    <button class="btn danger" onclick="resetSession()">שיחה חדשה</button>
  </div>
</header>

<div class="main-area">
  <!-- Workshops Panel -->
  <div class="workshops-panel" id="workshops-panel">
    <div class="panel-header">
      <h2>סדנאות</h2>
      <button class="panel-close" onclick="toggleWorkshops()">&times;</button>
    </div>
    <button class="new-workshop-btn" onclick="openNewWorkshopForm()">+ סדנה חדשה</button>
    <div class="workshops-list" id="workshops-list">
      <div style="padding: 20px; text-align: center; color: #999;">טוען...</div>
    </div>
  </div>

  <!-- New Workshop Modal -->
  <div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h2>יצירת סדנה חדשה</h2>
      <div class="form-group">
        <label>שם הסדנה (עברית)</label>
        <input type="text" id="ws-title" placeholder="למשל: קלודוש - מבוא לסוכנים">
      </div>
      <div class="form-group">
        <label>Slug (אנגלית, לשם התיקייה)</label>
        <input type="text" id="ws-slug" placeholder="למשל: claudosh-intro" dir="ltr" style="text-align:left">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>תאריך</label>
          <input type="date" id="ws-date">
        </div>
        <div class="form-group">
          <label>שעה</label>
          <input type="time" id="ws-time" value="20:00">
        </div>
      </div>
      <div class="form-group">
        <label>קהל יעד</label>
        <select id="ws-audience">
          <option value="מתחילים - ללא ידע קודם">מתחילים - ללא ידע קודם</option>
          <option value="משתמשים שכבר מכירים Claude Code">משתמשים שכבר מכירים Claude Code</option>
          <option value="מפתחים ואנשי טכנולוגיה">מפתחים ואנשי טכנולוגיה</option>
          <option value="בעלי עסקים ויזמים">בעלי עסקים ויזמים</option>
          <option value="קהל כללי">קהל כללי</option>
        </select>
      </div>
      <div class="form-group">
        <label>תיאור קצר - על מה הסדנה?</label>
        <textarea id="ws-description" placeholder="2-3 משפטים שמתארים את הנושא, מה המשתתפים ילמדו, ומה המסר המרכזי"></textarea>
      </div>
      <div class="form-group">
        <label>נושאים מרכזיים (אחד בכל שורה)</label>
        <textarea id="ws-topics" placeholder="למשל:&#10;התקנה והגדרת סביבה&#10;בניית CLAUDE.md&#10;יצירת סקיל ראשון&#10;דמו חי"></textarea>
      </div>
      <div class="form-group">
        <label>הערות נוספות (אופציונלי)</label>
        <textarea id="ws-notes" placeholder="POC מיוחד, דרישות טכניות, שיתופי פעולה, רעיונות לדמו..."></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-primary" onclick="submitNewWorkshop()">צור סדנה</button>
        <button class="btn-cancel" onclick="closeModal()">ביטול</button>
      </div>
    </div>
  </div>

  <!-- Chat Area -->
  <div class="chat-area">
    <div id="messages">
      <div class="welcome">
        <h2>Claude Code</h2>
        <p>מחובר לפרויקט architect-workshops עם גישה מלאה לכל הסקילים</p>
      </div>
    </div>

    <div class="typing" id="typing">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>

    <div class="input-wrap">
      <div class="input-area">
        <textarea id="input" placeholder="שלח הודעה לקלוד..." rows="1"></textarea>
        <button id="send" onclick="sendMessage()">&#9654;</button>
      </div>
    </div>
  </div>
</div>

<script>
  let sessionKey = localStorage.getItem('claude_session') || '';
  let isProcessing = false;
  let workshopsData = [];

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const typingEl = document.getElementById('typing');
  const workshopsPanel = document.getElementById('workshops-panel');
  const workshopsBtn = document.getElementById('workshops-btn');

  // --- Workshops ---

  function toggleWorkshops() {
    const isOpen = workshopsPanel.classList.toggle('open');
    workshopsBtn.classList.toggle('active', isOpen);
    if (isOpen && !workshopsData.length) loadWorkshops();
  }

  async function loadWorkshops() {
    try {
      const res = await fetch('/api/workshops');
      workshopsData = await res.json();
      renderWorkshops();
    } catch (e) {
      document.getElementById('workshops-list').innerHTML =
        '<div style="padding:20px;text-align:center;color:#dc2626;">שגיאה בטעינה</div>';
    }
  }

  function renderWorkshops() {
    const list = document.getElementById('workshops-list');
    const today = new Date().toISOString().slice(0, 10);

    list.innerHTML = workshopsData.map(w => {
      const isFuture = w.date >= today;
      const dateObj = new Date(w.date + 'T00:00:00');
      const dateStr = dateObj.toLocaleDateString('he-IL', {
        weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'
      });

      let badges = '';
      if (isFuture) badges += '<span class="badge green">קרובה</span>';
      if (w.has_landing_page) badges += '<span class="badge blue">דף נחיתה</span>';
      if (w.has_presentation) badges += '<span class="badge purple">מצגת</span>';

      const desc = w.description || '';

      return `
        <div class="workshop-card ${isFuture ? 'future' : 'past'}"
             onclick="askAboutWorkshop('${w.slug}', '${escapeAttr(w.title)}')">
          <div class="date">${dateStr}</div>
          <div class="title">${w.title || w.slug}</div>
          ${desc ? `<div class="desc">${desc}</div>` : ''}
          ${badges ? `<div class="badges">${badges}</div>` : ''}
        </div>
      `;
    }).join('');
  }

  function escapeAttr(s) {
    return s.replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }

  function askAboutWorkshop(slug, title) {
    const prompt = `ספר לי על הסדנה ${title} (${slug}) - מה הסטטוס, מה התוכנית, ומה צריך לעשות?`;
    inputEl.value = prompt;
    inputEl.focus();
    // On mobile, close panel
    if (window.innerWidth <= 768) {
      workshopsPanel.classList.remove('open');
      workshopsBtn.classList.remove('active');
    }
  }

  // --- New Workshop ---

  function openNewWorkshopForm() {
    // Default date to next Thursday
    const now = new Date();
    const daysUntilThursday = (4 - now.getDay() + 7) % 7 || 7;
    const nextThursday = new Date(now);
    nextThursday.setDate(now.getDate() + daysUntilThursday);
    document.getElementById('ws-date').value = nextThursday.toISOString().slice(0, 10);

    document.getElementById('modal-overlay').classList.add('open');

    // Auto-generate slug from title
    document.getElementById('ws-title').oninput = () => {
      const title = document.getElementById('ws-title').value.trim();
      // Simple transliteration for common Hebrew workshop names
      if (!document.getElementById('ws-slug').dataset.manual) {
        const slug = title
          .replace(/[^a-zA-Z0-9\s\-]/g, '')
          .trim()
          .replace(/\s+/g, '-')
          .toLowerCase();
        if (slug) document.getElementById('ws-slug').value = slug;
      }
    };
    document.getElementById('ws-slug').oninput = () => {
      document.getElementById('ws-slug').dataset.manual = '1';
    };
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    // Reset form
    ['ws-title','ws-slug','ws-description','ws-topics','ws-notes'].forEach(id => {
      document.getElementById(id).value = '';
    });
    delete document.getElementById('ws-slug').dataset.manual;
  }

  function submitNewWorkshop() {
    const title = document.getElementById('ws-title').value.trim();
    const slug = document.getElementById('ws-slug').value.trim();
    const date = document.getElementById('ws-date').value;
    const time = document.getElementById('ws-time').value;
    const audience = document.getElementById('ws-audience').value;
    const description = document.getElementById('ws-description').value.trim();
    const topics = document.getElementById('ws-topics').value.trim();
    const notes = document.getElementById('ws-notes').value.trim();

    if (!title || !date) {
      alert('חובה למלא שם וסתאריך');
      return;
    }

    const prompt = `הפעל את הסקיל workshop-creator ליצירת סדנה חדשה עם הפרטים הבאים:

**שם הסדנה:** ${title}
**Slug:** ${slug || title.replace(/\s+/g, '-').toLowerCase()}
**תאריך:** ${date}
**שעה:** ${time || '20:00'}
**קהל יעד:** ${audience}

**תיאור:**
${description || 'ליצור תיאור מתאים על בסיס שם הסדנה והנושאים'}

**נושאים מרכזיים:**
${topics || 'ליצור אג׳נדה מתאימה על בסיס שם הסדנה'}

${notes ? `**הערות נוספות:**\n${notes}` : ''}

צור את כל מבנה התיקיות, workshop.md מלא עם אג'נדה מפורטת, pipeline tracking, ותוכן ראשוני. וודא שהכל בעברית (חוץ מקוד וטכני). אחרי שסיימת, תן סיכום קצר של מה שנוצר.`;

    closeModal();

    // Close workshops panel on mobile
    if (window.innerWidth <= 768) {
      workshopsPanel.classList.remove('open');
      workshopsBtn.classList.remove('active');
    }

    // Send as chat message
    inputEl.value = prompt;
    sendMessage();

    // Reload workshops after a delay to show the new one
    setTimeout(() => { workshopsData = []; loadWorkshops(); }, 30000);
  }

  // --- Chat ---

  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function addMessage(text, role, cost) {
    const welcome = messagesEl.querySelector('.welcome');
    if (welcome) welcome.remove();

    const div = document.createElement('div');
    div.className = `message ${role}`;

    if (role === 'assistant') {
      let html = escapeHtml(text);
      html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      div.innerHTML = html;
      if (cost && cost > 0) {
        const costEl = document.createElement('div');
        costEl.className = 'cost';
        costEl.textContent = `$${cost.toFixed(4)}`;
        div.appendChild(costEl);
      }
    } else if (role === 'error') {
      div.textContent = text;
    } else {
      div.textContent = text;
    }

    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function escapeHtml(text) {
    const d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isProcessing) return;

    isProcessing = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';

    addMessage(text, 'user');
    typingEl.classList.add('active');
    messagesEl.scrollTop = messagesEl.scrollHeight;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_key: sessionKey }),
      });

      const data = await res.json();

      if (data.session_key) {
        sessionKey = data.session_key;
        localStorage.setItem('claude_session', sessionKey);
      }

      if (data.error) {
        addMessage(data.text, 'error');
      } else {
        addMessage(data.text, 'assistant', data.cost);
      }
    } catch (err) {
      addMessage(`Connection error: ${err.message}`, 'error');
    } finally {
      typingEl.classList.remove('active');
      isProcessing = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  async function resetSession() {
    if (sessionKey) {
      await fetch('/api/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_key: sessionKey }),
      }).catch(() => {});
    }
    sessionKey = '';
    localStorage.removeItem('claude_session');
    messagesEl.innerHTML = `
      <div class="welcome">
        <h2>Claude Code</h2>
        <p>מחובר לפרויקט architect-workshops עם גישה מלאה לכל הסקילים</p>
      </div>`;
  }

  fetch('/api/status').then(r => r.json()).then(d => {
    document.getElementById('status-info').textContent =
      `${d.model} | ${d.project.split('/').pop()}`;
  }).catch(() => {});

  inputEl.focus();
</script>
</body>
</html>
